[project]
name = "connect-ai-token-efficiency"
version = "0.1.0"
description = "Token, cache and reasoning efficiency observability for Amazon Connect AI agents"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
infra = [
    "aws-cdk-lib>=2.140.0",
    "constructs>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pyarrow>=15.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "golden: regression tests against captured production spans",
    "property: hypothesis property-based tests",
    "calibration: statistical gate calibration against falsified findings",
]
